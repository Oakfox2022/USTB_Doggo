ekf_filter_node:
  ros__parameters:

    use_sim_time: true

    frequency: 50.0

    # 发布 TF（关键！！）
    publish_tf: true

    # 坐标系
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # 输入：你的 /odom
    odom0: /odom

    # 用哪些数据（这里只用位姿）
    odom0_config: [true, true, true,
                   true, true, true,
                   true, true, true,
                   true, true, true,
                   false, false, false]

    odom0_differential: false
    odom0_relative: false